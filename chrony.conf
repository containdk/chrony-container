# Default chrony.conf for chrony-container

# Use public pool NTP servers for upstream synchronization
pool pool.ntp.org iburst

# Record the rate at which the system clock gains/losses time
driftfile /var/lib/chrony/chrony.drift

# Allow NTP client access from local network (can be overridden by mounting a different config)
# allow 10.0.0.0/8

# Serve time even if upstream is temporarily unreachable
local stratum 10

# Disable logging of client accesses to save disk I/O
noclientlog

# Disable command socket listening on external interfaces for security
bindcmdaddress 127.0.0.1
bindcmdaddress ::1
