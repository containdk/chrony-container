name: CI (Build, Test & Scan)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test, and Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # Secure default: Read-only access to repository contents

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ---------------------------------------------------------
      # 1. BUILD LOCAL IMAGES
      # ---------------------------------------------------------
      - name: Build local Docker images
        run: |
          docker build -t local-chrony:test .
          docker build -f Dockerfile.exporter -t local-chrony-exporter:test .

      # ---------------------------------------------------------
      # 2. RUN FUNCTIONAL READ-ONLY TEST
      # ---------------------------------------------------------
      - name: Test running Chrony in read-only mode
        run: |
          docker run -d --name test-instance --read-only \
            --tmpfs /run/chrony:uid=100,gid=101,mode=0750 \
            --tmpfs /var/lib/chrony:uid=100,gid=101,mode=0750 \
            -p 1123:123/udp local-chrony:test
          
          # Wait for container to start
          sleep 3
          docker logs test-instance
          
          # Validate that chronyd has started successfully
          if ! docker logs test-instance 2>&1 | grep -q "starting"; then
            echo "FAIL: Chrony did not start successfully!"
            exit 1
          fi
          
          # Validate that no folder permission warnings occurred
          if docker logs test-instance 2>&1 | grep -q "Wrong permissions"; then
            echo "FAIL: Wrong permissions on /run/chrony or state directories!"
            exit 1
          fi
          
          echo "SUCCESS: Read-only container test passed."
          docker rm -f test-instance

      # ---------------------------------------------------------
      # 3. TRIVY VULNERABILITY SCAN
      # ---------------------------------------------------------
      - name: Run Trivy vulnerability scanner on local Chrony image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'local-chrony:test'
          format: 'table'
          exit-code: '1' # Fail build on finding High/Critical CVEs
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Extract chrony_exporter image reference
        id: extract-exporter
        run: |
          EXPORTER_IMAGE=$(yq eval '.spec.template.spec.containers[] | select(.name == "chrony-exporter") | .image' kubernetes/daemonset.yaml)
          echo "image=${EXPORTER_IMAGE}" >> $GITHUB_OUTPUT

      - name: Run Trivy scan on chrony_exporter sidecar
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.extract-exporter.outputs.image }}
          format: 'table'
          exit-code: '1' # Fail build on finding High/Critical CVEs
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
