name: CD (Release & Publish)

on:
  push:
    tags: [ "v*" ] # Triggered ONLY when a semantic version tag is pushed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build, Publish, Sign & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to draft/publish GitHub Releases
      packages: write   # Required to push images to GHCR
      id-token: write   # Required for Cosign keyless OIDC signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 1. SETUP BUILD ENGINE
      # ---------------------------------------------------------
      # Set up QEMU (for multi-platform compatibility, e.g. arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------
      # 2. REGISTRY LOGIN
      # ---------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 3. METADATA & CRYPTOGRAPHIC SETUP
      # ---------------------------------------------------------
      # Extract tags and labels for multi-arch build
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      # Install Cosign (Sigstore)
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      # ---------------------------------------------------------
      # 4. BUILD, PUSH, SIGN & RELEASE
      # ---------------------------------------------------------
      # Build and Push (multi-platform: amd64 and arm64)
      - name: Build and Push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the image using OIDC keyless signing
      - name: Sign the published Docker image
        env:
          COSIGN_YES: "true"
        run: |
          # Sign by digest to cover all tags pointing to this build
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}"

      # Draft/Publish GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Chrony Container Release `${{ github.ref_name }}`
            
            This release packages Chrony inside a secure, containerized environment fully compatible with read-only root filesystems (e.g., Kubernetes nodes running Talos Linux).
            
            ### Container Image Info
            - **Registry:** `ghcr.io`
            - **Image:** `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}`
            - **Digest:** `${{ steps.build-and-push.outputs.digest }}`
            
            ### Verifying the Image Signature
            To verify the keyless OIDC signature using `cosign`, execute:
            ```bash
            cosign verify \
              --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
            ```
          draft: false
          prerelease: false
