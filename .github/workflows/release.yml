name: CD (Release & Publish)

on:
  push:
    tags: [ "v*" ] # Triggered ONLY when a semantic version tag is pushed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build, Publish, Sign & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to draft/publish GitHub Releases
      packages: write   # Required to push images to GHCR
      id-token: write   # Required for Cosign keyless OIDC signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ---------------------------------------------------------
      # 1. SETUP BUILD ENGINE
      # ---------------------------------------------------------
      # Set up QEMU (for multi-platform compatibility, e.g. arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Set up Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ---------------------------------------------------------
      # 2. REGISTRY LOGIN
      # ---------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 3. METADATA & CRYPTOGRAPHIC SETUP
      # ---------------------------------------------------------
      # Extract tags and labels for multi-arch build
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}

      # Extract tags and labels for chrony-exporter
      - name: Extract Exporter Docker metadata
        id: meta-exporter
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/chrony-exporter
          tags: |
            type=semver,pattern={{version}}

      # Install Cosign (Sigstore)
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      # ---------------------------------------------------------
      # 4. BUILD, PUSH, SIGN & RELEASE
      # ---------------------------------------------------------
      # Build and Push (multi-platform: amd64 and arm64)
      - name: Build and Push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the image using OIDC keyless signing
      - name: Sign the published Docker image
        env:
          COSIGN_YES: "true"
        run: |
          # Sign by digest to cover all tags pointing to this build
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}"

      # Build and Push Exporter (multi-platform: amd64 and arm64)
      - name: Build and Push Docker image for Exporter
        id: build-and-push-exporter
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.exporter
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-exporter.outputs.tags }}
          labels: ${{ steps.meta-exporter.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the exporter image using OIDC keyless signing
      - name: Sign the published Exporter Docker image
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ github.repository_owner }}/chrony-exporter@${{ steps.build-and-push-exporter.outputs.digest }}"

      # ---------------------------------------------------------
      # 5. PREPARE MANIFESTS WITH CONCRETE VERSION
      # ---------------------------------------------------------
      - name: Prepare release manifests
        run: |
          mkdir -p dist
          # Copy ConfigMap unchanged
          cp kubernetes/configmap.yaml dist/configmap.yaml

          # Replace latest tags with the exact release tags in the DaemonSet for both images
          sed -e "s|image: ghcr.io/containdk/chrony:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}|g" \
              -e "s|image: ghcr.io/containdk/chrony-exporter:latest|image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/chrony-exporter:${{ github.ref_name }}|g" \
              kubernetes/daemonset.yaml > dist/daemonset.yaml

      # Draft/Publish GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          files: |
            dist/configmap.yaml
            dist/daemonset.yaml
          body: |
            ## Chrony Container Release `${{ github.ref_name }}`
            
            This release packages Chrony and its Prometheus exporter inside a secure, containerized environment fully compatible with read-only root filesystems (e.g., Kubernetes nodes running Talos Linux).
            
            ### Container Images Info
            - **Chrony Image:** `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}`
            - **Chrony Exporter Image:** `${{ env.REGISTRY }}/${{ github.repository_owner }}/chrony-exporter:${{ github.ref_name }}`
            
            ### Verifying the Image Signatures
            To verify the keyless OIDC signatures using `cosign`, execute:
            ```bash
            cosign verify \
              --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}

            cosign verify \
              --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              ${{ env.REGISTRY }}/${{ github.repository_owner }}/chrony-exporter@${{ steps.build-and-push-exporter.outputs.digest }}
            ```
          draft: false
          prerelease: false
