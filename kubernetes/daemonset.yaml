apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ntp-server
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ntp-server
    app.kubernetes.io/instance: ntp-server
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: ntp
    app.kubernetes.io/managed-by: manual
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ntp-server
      app.kubernetes.io/instance: ntp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntp-server
        app.kubernetes.io/instance: ntp-server
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: ntp
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      securityContext:
        fsGroup: 101

      # Limit deployment to management / control-plane nodes
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      containers:
        - name: chrony
          image: ghcr.io/containdk/chrony:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: ntp
              containerPort: 123
              hostPort: 123
              protocol: UDP

          securityContext:
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
                - SETGID
                - SETUID
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: config-volume
              mountPath: /etc/chrony/chrony.conf
              subPath: chrony.conf
              readOnly: true
            - name: chrony-run
              mountPath: /run/chrony
            - name: chrony-state
              mountPath: /var/lib/chrony

        - name: chrony-exporter
          image: quay.io/superq/chrony-exporter:v0.13.3
          imagePullPolicy: IfNotPresent

          ports:
            - name: http-metrics
              containerPort: 9123
              hostPort: 9123
              protocol: TCP

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534

      volumes:
        - name: config-volume
          configMap:
            name: chrony-config
        - name: chrony-run
          emptyDir: {}
        - name: chrony-state
          emptyDir: {}
